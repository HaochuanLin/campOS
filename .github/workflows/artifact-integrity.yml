name: artifact-integrity

on:
  push:
  pull_request:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Verify installed verifier entry point
        run: campos-verify-artifacts --help
      - name: Generate synthetic quickstart artifacts
        run: campos-start --outdir out/artifact-integrity-smoke
      - name: Verify generated artifact hashes
        run: campos-verify-artifacts --manifest out/artifact-integrity-smoke/quickstart_manifest.json
      - name: Verify manifest has environment and checksum metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("out/artifact-integrity-smoke/quickstart_manifest.json").read_text())
          assert manifest["status"] == "simulation_completed_not_field_validated"
          assert manifest["python_version"]
          assert manifest["platform"]
          assert "results_fixed.csv" in manifest["artifact_checksums"]
          assert "results_movable.csv" in manifest["artifact_checksums"]
          assert all(len(item["sha256"]) == 64 for item in manifest["artifact_checksums"].values())
          PY
