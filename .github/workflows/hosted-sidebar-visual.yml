name: hosted-sidebar-visual

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

jobs:
  sidebar-contrast:
    name: Verify deployed sidebar contrast
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check live app and computed control contrast
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > check-sidebar.cjs <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const failures = [];
            const response = await page.goto('https://campos-optimizer.streamlit.app/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            }).catch(error => {
              failures.push('navigation failed: ' + error.message);
              return null;
            });

            // Streamlit Community Cloud can embed the app in a child frame; inspect every frame.
            let titleVisible = false;
            let selectedFrame = null;
            let result = { error: 'Streamlit sidebar was not found in any frame' };
            for (let attempt = 1; attempt <= 12; attempt++) {
              for (const frame of page.frames()) {
                const heading = await frame.getByText('Make every sprinkler', { exact: false }).first().isVisible().catch(() => false);
                const sidebarExists = await frame.locator('[data-testid="stSidebar"]').count().catch(() => 0);
                if (heading && sidebarExists > 0) {
                  titleVisible = true;
                  selectedFrame = frame;
                  break;
                }
              }
              if (selectedFrame) break;
              console.log('Waiting for app in page frames, attempt ' + attempt + '/12; frames=' + page.frames().length);
              await page.waitForTimeout(5000);
            }
            await page.screenshot({ path: 'artifacts/hosted-sidebar.png', fullPage: true }).catch(error => {
              failures.push('screenshot failed: ' + error.message);
            });
            if (!titleVisible) failures.push('expected campOS landing-page heading and sidebar were not visible in any frame');

            if (selectedFrame) {
              result = await selectedFrame.evaluate(() => {
                const sidebar = document.querySelector('[data-testid="stSidebar"]');
                if (!sidebar) return { error: 'Streamlit sidebar was not found' };
                const number = sidebar.querySelector('[data-testid="stNumberInput"] input');
                const select = sidebar.querySelector('[data-testid="stSelectbox"] [role="combobox"]') || sidebar.querySelector('[data-baseweb="select"]') || sidebar.querySelector('[data-testid="stSelectbox"]');
                const stepper = sidebar.querySelector('[data-testid="stNumberInput"] button');
                const multiSelect = sidebar.querySelector('[data-testid="stMultiSelect"]');
                const rgb = value => {
                  const m = value.match(/[0-9.]+/g);
                  return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null;
                };
                const luminance = values => {
                  const [r, g, b] = values.map(v => {
                    v /= 255;
                    return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
                  });
                  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
                };
                const contrast = (fg, bg) => {
                  const f = rgb(fg), b = rgb(bg);
                  if (!f || !b) return null;
                  const a = luminance(f), z = luminance(b);
                  return Number(((Math.max(a, z) + 0.05) / (Math.min(a, z) + 0.05)).toFixed(2));
                };
                const inspect = el => {
                  if (!el) return null;
                  const s = getComputedStyle(el);
                  let bg = s.backgroundColor;
                  let parent = el.parentElement;
                  while (bg === 'rgba(0, 0, 0, 0)' && parent) {
                    bg = getComputedStyle(parent).backgroundColor;
                    parent = parent.parentElement;
                  }
                  return { color: s.color, background: bg, contrast: contrast(s.color, bg) };
                };
                const multiSelectIcons = multiSelect
                  ? [...multiSelect.querySelectorAll('svg')].map((svg, index) => {
                      const svgStyle = getComputedStyle(svg);
                      const path = svg.querySelector('path');
                      const pathStyle = path ? getComputedStyle(path) : null;
                      const button = svg.closest('button');
                      let background = button ? getComputedStyle(button).backgroundColor : svgStyle.backgroundColor;
                      let parent = button ? button.parentElement : svg.parentElement;
                      while (background === 'rgba(0, 0, 0, 0)' && parent) {
                        background = getComputedStyle(parent).backgroundColor;
                        parent = parent.parentElement;
                      }
                      const foreground = pathStyle && pathStyle.stroke !== 'none'
                        ? pathStyle.stroke
                        : pathStyle && pathStyle.fill !== 'none' ? pathStyle.fill : svgStyle.color;
                      return {
                        index,
                        color: svgStyle.color,
                        stroke: pathStyle ? pathStyle.stroke : null,
                        fill: pathStyle ? pathStyle.fill : null,
                        opacity: svgStyle.opacity,
                        background,
                        contrast: contrast(foreground, background)
                      };
                    })
                  : [];
                return {
                  numberInput: inspect(number),
                  selectControl: inspect(select),
                  stepperButton: inspect(stepper),
                  multiSelectIcons
                };
              });
            }
            if (result.error) failures.push(result.error);
            if (!result.numberInput) failures.push('number input control was not found');
            else if (result.numberInput.contrast === null || result.numberInput.contrast < 4.5) {
              failures.push('number input contrast below WCAG AA 4.5:1');
            }
            if (!result.selectControl) failures.push('select control was not found');
            else if (result.selectControl.contrast === null || result.selectControl.contrast < 4.5) {
              failures.push('select control contrast below WCAG AA 4.5:1');
            }
            if (!result.stepperButton) failures.push('number input stepper button was not found');
            else if (result.stepperButton.contrast === null || result.stepperButton.contrast < 3) {
              failures.push('stepper button contrast below 3:1');
            }
            if (!result.multiSelectIcons || result.multiSelectIcons.length < 2) {
              failures.push('multi-select clear/dropdown icons were not both found');
            } else {
              result.multiSelectIcons.forEach((icon, index) => {
                if (icon.contrast === null || icon.contrast < 3 || icon.opacity !== '1') {
                  failures.push('multi-select icon ' + index + ' contrast/opacity below requirement');
                }
              });
            }

            require('fs').writeFileSync('artifacts/contrast-report.json', JSON.stringify({
              httpStatus: response ? response.status() : null,
              pageUrl: page.url(),
              titleVisible,
              computedStyles: result,
              failures
            }, null, 2));
            console.log(JSON.stringify({ httpStatus: response ? response.status() : null, pageUrl: page.url(), titleVisible, computedStyles: result, failures }, null, 2));
            await browser.close();
            if (failures.length) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node check-sidebar.cjs
      - name: Upload screenshot and computed contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-sidebar-visual-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
