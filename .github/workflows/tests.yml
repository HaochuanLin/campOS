name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Verify installed command-line entry points
        run: |
          campos-sim --help
          campos-field-evaluate --help
          campos-observation-qc --help
          campos-field-report --help
      - name: Check precipitation benchmark
        if: matrix.python-version == '3.10'
        run: python scripts/benchmark_sprinkler_curve.py
      - name: Run field-evaluation CLI smoke test
        if: matrix.python-version == '3.10'
        run: |
          cat > out-acceptance-thresholds.json <<'JSON'
          {
            "max_holdout_mae_mm": 1000,
            "max_holdout_rmse_mm": 1000,
            "max_absolute_bias_mm": 1000
          }
          JSON
          campos-field-evaluate \
            --polygon-csv examples/field_evaluation_demo/site_polygon.csv \
            --heads-csv examples/field_evaluation_demo/sprinkler_layout.csv \
            --observations examples/field_evaluation_demo/catch_can_observations.csv \
            --acceptance-thresholds-json out-acceptance-thresholds.json \
            --outdir out/field-evaluation-smoke
          test -s out/field-evaluation-smoke/paired_predictions.csv
          test -s out/field-evaluation-smoke/field_evaluation_metrics.json
          python -c "import json,re; p=json.load(open('out/field-evaluation-smoke/field_evaluation_metrics.json')); assert p['acceptance_assessment'] is not None; assert len(p['acceptance_assessment']['checks']) == 3; assert re.fullmatch(r'[0-9a-f]{64}', p['acceptance_thresholds_json_sha256'])"
          campos-field-report --input-json out/field-evaluation-smoke/field_evaluation_metrics.json
          test -s out/field-evaluation-smoke/field_evaluation_report.html
          test -s out/field-evaluation-smoke/field_evaluation_report.md
      - name: Run design report smoke test
        if: matrix.python-version == '3.10'
        run: |
          python campos_sim.py --mode movable --quick --sites A --outdir out/report-smoke
          python scripts/build_design_report.py --input-dir out/report-smoke
          test -s out/report-smoke/design_report.html
          test -s out/report-smoke/design_report.md
      - name: Run matched JSON design comparison smoke test
        if: matrix.python-version == '3.10'
        run: |
          mkdir -p out
          cat > out/design-comparison-spec.json <<'JSON'
          {
            "shared": {
              "sites": ["A"],
              "seed": 7,
              "cell_size": 1.0,
              "radial_slope": 0.0,
              "quick": true
            },
            "scenarios": [
              {"name": "fixed", "overrides": {"mode": "fixed"}},
              {"name": "movable", "overrides": {"mode": "movable"}}
            ]
          }
          JSON
          python scripts/compare_design_configs.py --spec out/design-comparison-spec.json --outdir out/design-comparison
          test -s out/design-comparison/design_comparison.csv
          test -s out/design-comparison/comparison_manifest.json
      - name: Run parameter sensitivity smoke test
        if: matrix.python-version == '3.10'
        run: python scripts/parameter_sensitivity.py --quick --sites A --seeds 7 19 --cell-sizes 1.0 --slopes -0.5 0 1 --outdir out/parameter-sensitivity
      - name: Run matched optimization benchmark smoke test
        if: matrix.python-version == '3.10'
        run: |
          python scripts/compare_optimization_modes.py --quick --sites E --outdir out/optimization-benchmark
          python -c "import csv; p='out/optimization-benchmark/benchmark_summary.csv'; rows=list(csv.DictReader(open(p, newline='', encoding='utf-8-sig'))); chosen=[r for r in rows if r['mode'].startswith('pareto-')]; assert len(chosen)==2; assert all(r['selected_tradeoff'] != 'YES' for r in chosen); assert all(r['selection_failure_reasons'] for r in chosen); assert all(sum(int(r[k]) for k in ('guardrail_cu_rejected_candidates','guardrail_overspray_rejected_candidates','guardrail_interior_deficit_rejected_candidates','guardrail_dry_area_rejected_candidates')) > 0 for r in chosen)"
      - name: Upload optimization benchmark results
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: campos-optimization-benchmark
          path: out/optimization-benchmark/
          if-no-files-found: warn
          retention-days: 14
      - name: Run explicit Pareto trade-off smoke test
        if: matrix.python-version == '3.10'
        run: |
          python scripts/compare_optimization_modes.py --quick --sites E \
            --cu-drop-budget 0.03 --max-overspray-increase 0.08 \
            --outdir out/optimization-benchmark-tolerant
          python -c "import csv; p='out/optimization-benchmark-tolerant/benchmark_summary.csv'; rows=list(csv.DictReader(open(p, newline='', encoding='utf-8-sig'))); chosen=[r for r in rows if r['mode'].startswith('pareto-')]; assert len(chosen)==2; assert all(r['selected_tradeoff']=='YES' for r in chosen); assert all(float(r['max_overspray_increase'])==0.08 for r in chosen); assert all(r['selection_failure_reasons']=='' for r in chosen)"
      - name: Upload explicit Pareto trade-off results
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: campos-optimization-benchmark-tolerant
          path: out/optimization-benchmark-tolerant/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload design report smoke artifact
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: campos-design-report-smoke
          path: out/report-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload matched design comparison
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: campos-design-comparison
          path: out/design-comparison/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload parameter sensitivity results
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: campos-parameter-sensitivity
          path: out/parameter-sensitivity/
          if-no-files-found: warn
          retention-days: 14
