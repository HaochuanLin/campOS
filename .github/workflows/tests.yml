name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run radial sensitivity scenarios
        if: matrix.python-version == '3.10'
        run: python scripts/radial_sensitivity.py --outdir out/radial-sensitivity
      - name: Upload sensitivity results
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: campos-radial-sensitivity
          path: out/radial-sensitivity/
          if-no-files-found: warn
          retention-days: 14
