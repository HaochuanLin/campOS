name: ui-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  streamlit-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install UI dependencies
        run: python -m pip install -e ".[ui,ai,dev]"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Verify installed CLI entry points
        run: |
          campos-start --help
          campos-sim --help
          campos-field-evaluate --help
          campos-observation-qc --help
          campos-field-report --help
          campos-verify-artifacts --help
      - name: Run regression test suite
        run: python -m pytest -q
      - name: Compile the UI module
        run: python -m py_compile src/campos/app.py streamlit_app.py
      - name: Run the packaged quickstart and verify its artifacts
        run: |
          set -euo pipefail
          campos-start --outdir out/ci-quickstart --mode compare --sites A
          test -s out/ci-quickstart/index.html
          test -s out/ci-quickstart/quickstart_manifest.json
          campos-verify-artifacts --manifest out/ci-quickstart/quickstart_manifest.json
      - name: Exercise the app script with Streamlit AppTest
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          expected_templates = {
              "site_polygon_template.csv",
              "sprinkler_layout_template.csv",
              "protected_surface_template.csv",
              "field_catch_can_template.csv",
              "catch_can_profile_template.csv",
              "sprinkler_performance_template.csv",
          }
          template_dir = Path("data/templates")
          missing_templates = sorted(name for name in expected_templates if not (template_dir / name).is_file())
          assert not missing_templates, f"Starter templates missing from repository: {missing_templates}"

          app = AppTest.from_file("streamlit_app.py", default_timeout=120).run()
          assert not app.exception, "\n".join(str(item) for item in app.exception)
          assert any(button.label == "Run simulation" for button in app.button), "Run simulation button is missing"
          assert any(item.label == "Use surveyed site CSVs" for item in app.checkbox), "Surveyed-site mode toggle is missing"

          run_button = next(button for button in app.button if button.label == "Run simulation")
          run_button.click().run()
          assert not app.exception, "\n".join(str(item) for item in app.exception)
          downloads = app.get("download_button")
          assert any(item.label == "Download complete run bundle (.zip)" for item in downloads), "Complete-run ZIP download is missing after simulation"

          custom_site_toggle = next(item for item in app.checkbox if item.label == "Use surveyed site CSVs")
          custom_site_toggle.check().run()
          assert not app.exception, "\n".join(str(item) for item in app.exception)
          starter_downloads = app.get("download_button")
          assert any(item.label == "Download all starter templates (.zip)" for item in starter_downloads), "Starter-template ZIP is missing in surveyed-site mode"
          print("Streamlit AppTest passed: synthetic run, result ZIP, and surveyed-site starter-template ZIP are available.")
          PY
      - name: Start Streamlit and verify HTTP health
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless true --server.address 127.0.0.1 --server.port 8501 \
            > out-streamlit.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health > /tmp/campos-health.txt 2>/dev/null; then
              healthy=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Streamlit exited before becoming healthy."
              cat out-streamlit.log
              exit 1
            fi
            sleep 1
          done

          cat out-streamlit.log
          if [ "$healthy" -ne 1 ]; then
            echo "Streamlit health endpoint did not return HTTP 200 within 30 seconds."
            exit 1
          fi
          grep -Eqi "You can now view your Streamlit app|Network URL|Local URL" out-streamlit.log
      - name: Upload Streamlit startup log on failure
        if: failure() && always()
        uses: actions/upload-artifact@v6
        with:
          name: campos-streamlit-startup-log
          path: out-streamlit.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish workflow summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## campOS UI smoke test"
            echo
            echo "- Job result: $JOB_STATUS"
            echo "- Commit: $GITHUB_SHA"
            echo "- Checks: pytest, Python compilation, Streamlit AppTest, HTTP health endpoint."
            echo "- Surveyed-site mode checks the starter-template ZIP and all six source CSVs."
          } >> "$GITHUB_STEP_SUMMARY"
